# Local profile (H2 in-memory, PostgreSQL compatibility mode, Flyway migrations)
server.port=8080

spring.datasource.url=jdbc:h2:mem:haui_local;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway placeholders for H2 compatibility (bỏ qua pgvector DDL đặc thù)
spring.flyway.enabled=true
spring.flyway.placeholders.pgvector_init=-- skipped pgvector for local h2
spring.flyway.placeholders.vector_column_type=OTHER
spring.flyway.placeholders.vector_index_hnsw=-- skipped hnsw vector index for local h2

# Seed demo accounts (mật khẩu mặc định phục vụ đăng nhập local: HaUI@2024Pass)
haui.seed.demo-accounts.enabled=true
haui.seed.demo-accounts.password=HaUI@2024Pass

# AI configuration (kết nối live Gemini model)
ai.mode=live
ai.model.api-key=${GEMINI_API_KEY:}
ai.rag.store-type=IN_MEMORY
