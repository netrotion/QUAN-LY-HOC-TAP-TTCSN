# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# Application Info
spring.application.name=haui-advisor-platform
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}

# Database Connection (PostgreSQL with pgvector)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:haui_advisor}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Migration via Flyway (nguồn schema duy nhất)
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.placeholders.pgvector_init=${FLYWAY_PGVECTOR_INIT:CREATE EXTENSION IF NOT EXISTS vector;}

# Actuator Health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# Security & Session (session cookie + CSRF, chỉ STUDENT)
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# JSON: không làm tròn ngầm số lẻ vào trường số nguyên
spring.jackson.deserialization.accept-float-as-int=false

# Nhập bảng điểm: giới hạn upload (multipart chặn ở tầng servlet, service kiểm tra lại)
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_REQUEST_SIZE:6MB}
server.tomcat.max-swallow-size=10MB
haui.import.max-file-bytes=5242880
haui.import.max-pages=10
haui.import.max-image-pixels=40000000
haui.import.max-rows=300
haui.import.max-open-sessions=3
haui.import.session-ttl=24h
haui.import.ocr.engine=${OCR_ENGINE:disabled}
haui.import.ocr.command=${OCR_TESSERACT_COMMAND:tesseract}
haui.import.ocr.languages=${OCR_LANGUAGES:vie+eng}
haui.import.ocr.timeout=60s

# Seed từ fixture TV4: CTĐT luôn đồng bộ; tài khoản demo chỉ tạo khi bật và có mật khẩu
haui.seed.demo-accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
haui.seed.demo-accounts.password=${DEMO_ACCOUNT_PASSWORD:}
