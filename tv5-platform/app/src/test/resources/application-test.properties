# Test configuration - H2 (PostgreSQL mode) + Flyway, không cần PostgreSQL thật
spring.datasource.url=jdbc:h2:mem:haui_app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=true
spring.flyway.placeholders.pgvector_init=-- test db: pgvector skipped
server.port=0

# Tài khoản demo seed từ fixture TV4 (mật khẩu chỉ dùng trong test)
haui.seed.demo-accounts.enabled=true
haui.seed.demo-accounts.password=test-demo-password-123

# Trợ lý AI: test không dùng khóa của máy chạy test; test cần mô hình dùng AdvisorTestConfig (mô hình giả lập có kiểm soát)
ai.model.api-key=
haui.advisor.chat-timeout=5s
