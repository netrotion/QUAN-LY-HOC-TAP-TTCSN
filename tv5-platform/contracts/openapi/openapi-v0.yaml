openapi: 3.0.3
info:
  title: HaUI Advisor API
  description: >
    Hợp đồng giao tiếp kỹ thuật V0 cho dự án HaUI Advisor.
    Các endpoint nghiệp vụ được đánh dấu x-implementation-status: NOT_IMPLEMENTED.
  version: 0.0.1-v0
servers:
  - url: /api/v1
    description: Base URL tương đối qua frontend proxy

tags:
  - name: System
    description: Endpoint thông tin hệ thống và health check
  - name: Academic
    description: Tra cứu trạng thái học vụ và điều kiện môn học
  - name: Planner
    description: Lập và thẩm định kế hoạch học tập
  - name: Simulation
    description: Giả lập điểm số, tối ưu học cải thiện và tính điểm ngược
  - name: Audit
    description: Rà soát điều kiện tốt nghiệp
  - name: Advisor
    description: Trợ lý ảo tư vấn học vụ qua hội thoại

paths:
  /system/bootstrap:
    get:
      tags: [System]
      summary: Thông tin bootstrap kỹ thuật
      operationId: getBootstrapInfo
      responses:
        '200':
          description: Thông tin khởi động khung dự án
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapInfoResponse'

  /system/health:
    get:
      tags: [System]
      summary: Health check kỹ thuật
      operationId: getSystemHealth
      responses:
        '200':
          description: Trạng thái tiến trình hoạt động
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time

  /academic/status:
    get:
      tags: [Academic]
      summary: Lấy trạng thái học vụ cá nhân
      operationId: getAcademicStatus
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /academic/eligibility:
    post:
      tags: [Academic]
      summary: Kiểm tra điều kiện tiên quyết môn học
      operationId: checkEligibility
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/plan:
    get:
      tags: [Planner]
      summary: Lấy chi tiết kế hoạch học tập (read)
      operationId: getStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      parameters:
        - name: planId
          in: query
          required: false
          schema:
            type: string
          description: ID kế hoạch cần đọc; nếu để trống sẽ đọc kế hoạch ACTIVE hiện hành của sinh viên
      responses:
        '200':
          description: Chi tiết kế hoạch học tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyPlanDetailResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/preview:
    post:
      tags: [Planner]
      summary: Xem trước kế hoạch học tập tối ưu trước khi lưu (preview)
      operationId: previewStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewStudyPlanRequest'
      responses:
        '200':
          description: Kết quả xem trước kế hoạch học tập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewStudyPlanResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/generate:
    post:
      tags: [Planner]
      summary: Sinh đề xuất kế hoạch học tập
      operationId: generateStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/validate:
    post:
      tags: [Planner]
      summary: Thẩm định kế hoạch học tập theo quy chế (validate)
      operationId: validateStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/save:
    post:
      tags: [Planner]
      summary: Lưu kế hoạch học tập (save)
      operationId: saveStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveStudyPlanRequest'
      responses:
        '200':
          description: Kế hoạch học tập đã được lưu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveStudyPlanResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/activate:
    post:
      tags: [Planner]
      summary: Kích hoạt kế hoạch học tập sang trạng thái ACTIVE (activate)
      operationId: activateStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateStudyPlanRequest'
      responses:
        '200':
          description: Kế hoạch học tập đã được kích hoạt thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivateStudyPlanResponse'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /planner/reconcile:
    post:
      tags: [Planner]
      summary: Đối chiếu kết quả học kỳ với kế hoạch (US-13)
      operationId: reconcileStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /simulation/grades:
    post:
      tags: [Simulation]
      summary: Giả lập điểm số học kỳ tới (What-if)
      operationId: simulateGrades
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /simulation/retake-ranking:
    post:
      tags: [Simulation]
      summary: Xếp hạng môn học cải thiện tối ưu CPA
      operationId: rankRetakeCourses
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /simulation/target-grades:
    post:
      tags: [Simulation]
      summary: Tính điểm mục tiêu ngược các kỳ còn lại
      operationId: calculateTargetGrades
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /audit/graduation:
    get:
      tags: [Audit]
      summary: Rà soát tiến độ và điều kiện tốt nghiệp
      operationId: runGraduationAudit
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /advisor/chat:
    post:
      tags: [Advisor]
      summary: Gửi câu hỏi học vụ tới AI Advisor
      operationId: chatAdvisor
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

components:
  responses:
    NotImplemented:
      description: Chức năng nghiệp vụ chưa được triển khai ở mốc Bootstrap V0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorResponse'

  schemas:
    BootstrapInfoResponse:
      type: object
      required:
        - contractVersion
        - runtimeMode
        - modules
      properties:
        contractVersion:
          type: string
          example: "0.0.1-v0"
        runtimeMode:
          type: string
          example: "bootstrap-v0"
        modules:
          type: object
          properties:
            contracts:
              type: string
              example: "READY"
            ai:
              type: string
              example: "NOT_IMPLEMENTED"
            academic:
              type: string
              example: "NOT_IMPLEMENTED"
            persistence:
              type: string
              example: "NOT_IMPLEMENTED"

    ApiErrorResponse:
      type: object
      required:
        - code
        - message
        - requestId
        - timestamp
      properties:
        code:
          type: string
          example: "NOT_IMPLEMENTED"
        message:
          type: string
          example: "Chức năng chưa được triển khai trong mốc bootstrap-v0"
        requestId:
          type: string
          example: "req-12345"
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: string

    StudyPlanDetailResponse:
      type: object
      properties:
        planId:
          type: string
          example: "plan-2024-k19-001"
        studentId:
          type: string
          example: "2024604757"
        planName:
          type: string
          example: "Kế hoạch học tập KTPM K19"
        status:
          type: string
          enum: [DRAFT, VALIDATED, ACTIVE, COMPLETED, ARCHIVED]
          example: "VALIDATED"
        version:
          type: integer
          example: 1
        dataRevision:
          type: string
          example: "REV-2024-001"
        targetCpa:
          type: number
          format: float
          example: 3.20
        targetGraduationSemester:
          type: string
          example: "2028_1"
        maxCreditsPerSemester:
          type: integer
          example: 20
        semesters:
          type: array
          items:
            $ref: '#/components/schemas/PlannedSemesterItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ChatActionItem'
        warnings:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PreviewStudyPlanRequest:
      type: object
      properties:
        targetGraduationSemester:
          type: string
          example: "2028_1"
        targetCpa:
          type: number
          format: float
          example: 3.20
        maxCreditsPerSemester:
          type: integer
          example: 20
        includeSummerSemesters:
          type: boolean
          example: true
        selectedRetakeCourseCodes:
          type: array
          items:
            type: string
        dataRevision:
          type: string
          example: "REV-2024-001"

    PreviewStudyPlanResponse:
      type: object
      properties:
        planName:
          type: string
          example: "Đề xuất lộ trình học tập tối ưu"
        status:
          type: string
          example: "DRAFT"
        targetCpa:
          type: number
          format: float
          example: 3.20
        estimatedFinalCpa:
          type: number
          format: float
          example: 3.25
        totalPlannedCredits:
          type: integer
          example: 105
        semesters:
          type: array
          items:
            $ref: '#/components/schemas/PlannedSemesterItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ChatActionItem'
        warnings:
          type: array
          items:
            type: string
        dataRevision:
          type: string
          example: "REV-2024-001"

    SaveStudyPlanRequest:
      type: object
      required:
        - planName
        - semesters
      properties:
        planId:
          type: string
          nullable: true
          example: "plan-2024-k19-001"
        planName:
          type: string
          example: "Kế hoạch học tập KTPM K19"
        planVersion:
          type: integer
          example: 1
        dataRevision:
          type: string
          example: "REV-2024-001"
        targetCpa:
          type: number
          format: float
          example: 3.20
        targetGraduationSemester:
          type: string
          example: "2028_1"
        maxCreditsPerSemester:
          type: integer
          example: 20
        semesters:
          type: array
          items:
            $ref: '#/components/schemas/PlannedSemesterItem'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ChatActionItem'

    SaveStudyPlanResponse:
      type: object
      properties:
        planId:
          type: string
          example: "plan-2024-k19-001"
        planName:
          type: string
          example: "Kế hoạch học tập KTPM K19"
        status:
          type: string
          example: "VALIDATED"
        planVersion:
          type: integer
          example: 2
        dataRevision:
          type: string
          example: "REV-2024-001"
        savedAt:
          type: string
          format: date-time
        message:
          type: string
          example: "Lưu kế hoạch học tập thành công"

    ActivateStudyPlanRequest:
      type: object
      required:
        - planId
      properties:
        planId:
          type: string
          example: "plan-2024-k19-001"
        expectedVersion:
          type: integer
          example: 2
        dataRevision:
          type: string
          example: "REV-2024-001"

    ActivateStudyPlanResponse:
      type: object
      properties:
        planId:
          type: string
          example: "plan-2024-k19-001"
        status:
          type: string
          example: "ACTIVE"
        activatedAt:
          type: string
          format: date-time
        archivedPlanIds:
          type: array
          items:
            type: string
        message:
          type: string
          example: "Kích hoạt kế hoạch học tập thành công"

    StudentDataVersion:
      type: object
      properties:
        studentId:
          type: string
          example: "2024604757"
        dataRevision:
          type: string
          example: "REV-2024-001"
        version:
          type: integer
          example: 1
        lastUpdated:
          type: string
          format: date-time
        stale:
          type: boolean
          example: false

    PlannedSemesterItem:
      type: object
      properties:
        semesterOrder:
          type: integer
          example: 1
        semesterCode:
          type: string
          example: "2024_1"
        semesterName:
          type: string
          example: "Học kỳ 1 năm học 2024-2025"
        plannedCredits:
          type: integer
          example: 18
        estimatedGpa:
          type: number
          format: float
          example: 3.20
        courses:
          type: array
          items:
            $ref: '#/components/schemas/PlannedCourseItem'

    PlannedCourseItem:
      type: object
      properties:
        courseCode:
          type: string
          example: "IT6015"
        courseName:
          type: string
          example: "Cấu trúc dữ liệu và giải thuật"
        credits:
          type: integer
          example: 3
        targetGrade:
          type: string
          example: "A"
        rationale:
          type: string
          example: "Môn tiên quyết cho Lập trình nâng cao"
        courseType:
          type: string
          example: "STANDARD"
        status:
          type: string
          example: "PLANNED"

    ChatActionItem:
      type: object
      properties:
        actionType:
          type: string
          example: "UNBLOCK_PREREQUISITE"
        label:
          type: string
          example: "Xem gợi ý môn học"
        targetRoute:
          type: string
          example: "/planner"
        payloadJson:
          type: string
          example: "{}"
        description:
          type: string
          example: "Ưu tiên đạt điểm môn tiên quyết"
        priority:
          type: integer
          example: 1
