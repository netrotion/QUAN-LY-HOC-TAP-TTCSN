        attempts:
          type: array
          description: "Các lần học, theo học kỳ."
          items:
            $ref: "#/components/schemas/TranscriptAttemptItem"
    ImportRowIssueItem:
      type: object
      description: "Một vấn đề trên dòng nhập."
      required: [code, blocking, message]
      properties:
        code:
          $ref: "#/components/schemas/ImportIssueCode"
        blocking:
          type: boolean
          description: "Chặn xác nhận cho tới khi sửa hoặc bỏ chọn dòng."
        message:
          type: string
          description: "Diễn giải cho người dùng."
    TranscriptImportRowItem:
      type: object
      description: "Một dòng chờ xem lại. Khi gửi lên server chỉ nhận rowId, courseCode, semesterCode, score10, letterGrade, included."
      properties:
        rowId:
          type: string
          description: "Mã dòng; null với dòng thêm tay."
          nullable: true
        sourceText:
          type: string
          description: "Dòng chữ gốc đọc được từ tài liệu (để đối chiếu)."
          nullable: true
        courseCode:
          type: string
          description: "Mã học phần."
          nullable: true
        courseName:
          type: string
          description: "Tên học phần theo CTĐT; null khi mã không có trong CTĐT."
          nullable: true
        documentCourseName:
          type: string
          description: "Tên học phần đúng như trên tài liệu."
          nullable: true
        credits:
          type: number
          description: "Số tín chỉ theo CTĐT."
          minimum: 0
          nullable: true
        semesterCode:
          type: string
          description: "Học kỳ học."
          pattern: "^[0-9]{4}_(1|2|SUMMER)$"
          example: "2026_1"
          nullable: true
        score10:
          type: number
          description: "Điểm hệ 10 đúng như bảng điểm; null = chưa có điểm (đang học)."
          minimum: 0
          maximum: 10
          nullable: true
        letterGrade:
          type: string
          description: "Điểm chữ đúng như bảng điểm (A, B+, B, C+, C, D+, D, F); null = chưa có điểm."
          example: "B+"
          nullable: true
        included:
          type: boolean
          description: "Đưa dòng này vào bảng điểm khi xác nhận."
          nullable: true
        confidence:
          type: number
          description: "Độ tin cậy OCR 0..1; null với parser/nhập tay."
          minimum: 0
          maximum: 1
          nullable: true
        issues:
          type: array
          description: "Vấn đề của dòng."
          items:
            $ref: "#/components/schemas/ImportRowIssueItem"
          nullable: true
    TranscriptDocumentSummary:
      type: object
      description: "Thông tin in trên tài liệu, chỉ để đối chiếu. reportedCpa/reportedAccumulatedCredits không bao giờ được lưu làm số liệu học vụ."
      properties:
        studentIdOnDocument:
          type: string
          description: "Mã sinh viên in trên tài liệu."
          nullable: true
        fullNameOnDocument:
          type: string
          description: "Họ tên in trên tài liệu."
          nullable: true
        reportedCpa:
          type: number
          description: "CPA in trên tài liệu (tham khảo, không dùng để tính)."
          nullable: true
        reportedAccumulatedCredits:
          type: number
          description: "Số tín chỉ tích lũy in trên tài liệu (tham khảo)."
          nullable: true
    TranscriptImportResponse:
      type: object
      description: "Phiên nhập bảng điểm: tải lên/nhập tay → xem lại → xác nhận."
      required:
        - importSessionId
        - status
        - sourceType
        - sessionVersion
        - rows
        - warnings
        - blockingIssueCount
        - createdAt
        - expiresAt
      properties:
        importSessionId:
          type: string
          description: "Mã phiên nhập bảng điểm."
        status:
          $ref: "#/components/schemas/ImportSessionStatus"
        sourceType:
          $ref: "#/components/schemas/TranscriptSourceType"
        fileName:
          type: string
          description: "Tên file đã làm sạch; null khi nhập tay."
          nullable: true
        fileSizeBytes:
          type: integer
          format: int64
          description: "Dung lượng file."
          nullable: true
        pageCount:
          type: integer
          format: int32
          description: "Số trang (PDF) hoặc 1 (ảnh)."
          nullable: true
        sessionVersion:
          type: integer
          format: int32
          description: "Phiên bản phiên nhập (optimistic lock); tăng khi sửa dòng."
          minimum: 1
        rows:
          type: array
          description: "Các dòng chờ xem lại."
          items:
            $ref: "#/components/schemas/TranscriptImportRowItem"
        documentSummary:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/TranscriptDocumentSummary"
        warnings:
          type: array
          description: "Cảnh báo không chặn thao tác (hiển thị cho người dùng)."
          items:
            type: string
        blockingIssueCount:
          type: integer
          format: int32
          description: "Số vấn đề chặn trên các dòng included."
        createdAt:
          type: string
          description: "Thời điểm tạo."
          format: date-time
        updatedAt:
          type: string
          description: "Lần sửa gần nhất."
          format: date-time
          nullable: true
        expiresAt:
          type: string
          description: "Hạn xem lại; quá hạn → EXPIRED."
          format: date-time
        confirmedAt:
          type: string
          description: "Thời điểm xác nhận."
          format: date-time
          nullable: true
    TranscriptImportListResponse:
      type: object
      description: "Các phiên nhập gần nhất, mới trước."
      required: [sessions]
      properties:
        sessions:
          type: array
          description: "Phiên nhập."
          items:
            $ref: "#/components/schemas/TranscriptImportResponse"
    UpdateImportRowsRequest:
      type: object
      description: "Thay toàn bộ dòng của phiên sau khi sinh viên sửa."
      required: [sessionVersion, rows]
      properties:
        sessionVersion:
          type: integer
          format: int32
          description: "Phiên bản client đang giữ."
          minimum: 1
        rows:
          type: array
          description: "Danh sách dòng mới."
          items:
            $ref: "#/components/schemas/TranscriptImportRowItem"
    ConfirmTranscriptImportRequest:
      type: object
      description: "Xác nhận phiên: thay bảng điểm chính thức bằng các dòng included, tăng dataRevision."
      required: [sessionVersion, dataRevision]
      properties:
        sessionVersion:
          type: integer
          format: int32
          description: "Phiên bản client đang giữ."
          minimum: 1
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
    CertificateStatus:
      type: string
      description: "Trạng thái tự khai báo (không phải xác nhận của trường)."
      enum: [ACHIEVED, NOT_ACHIEVED, UNKNOWN]
    CertificateVerification:
      type: string
      description: "Nguồn trạng thái; hệ thống không xác minh với trường."
      enum: [SELF_DECLARED, DEMO_SEED, NOT_DECLARED]
    CertificateStatusItem:
      type: object
      description: "Trạng thái một chuẩn đầu ra phi tín chỉ của sinh viên."
      required: [requirementCode, category, name, status, verification]
      properties:
        requirementCode:
          type: string
          description: "Mã chuẩn đầu ra."
          example: IT_SKILLS
        category:
          type: string
          description: "Nhóm điều kiện."
        name:
          type: string
          description: "Tên chuẩn đầu ra."
        status:
          $ref: "#/components/schemas/CertificateStatus"
        verification:
          $ref: "#/components/schemas/CertificateVerification"
        evidenceNote:
          type: string
          description: "Ghi chú minh chứng do sinh viên nhập."
          maxLength: 500
          nullable: true
        achievedOn:
          type: string
          description: "Ngày đạt (yyyy-MM-dd)."
          format: date
          nullable: true
        updatedAt:
          type: string
          description: "Lần khai báo gần nhất."
          format: date-time
          nullable: true
    CertificateListResponse:
      type: object
      description: "Chuẩn đầu ra phi tín chỉ và trạng thái khai báo."
      required: [certificates]
      properties:
        certificates:
          type: array
          description: "Danh sách."
          items:
            $ref: "#/components/schemas/CertificateStatusItem"
    DeclareCertificateRequest:
      type: object
      description: "Sinh viên tự khai báo trạng thái chứng chỉ; tăng dataRevision."
      required: [status, dataRevision]
      properties:
        status:
          $ref: "#/components/schemas/CertificateStatus"
        evidenceNote:
          type: string
          description: "Ghi chú minh chứng."
          maxLength: 500
          nullable: true
        achievedOn:
          type: string
          description: "Ngày đạt (yyyy-MM-dd)."
          format: date
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
    StudentAcademicRecord:
      type: object
      description: "[Port StudentAcademicRecordProvider] Dữ liệu học vụ gốc cho AcademicFacade: chỉ bảng điểm đã xác nhận và khai báo chứng chỉ, không có GPA/CPA."
      required: [studentId, dataRevision, curriculumId, transcriptStatus, attempts, certificates]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
        curriculumId:
          type: string
          description: "Mã CTĐT trong hệ thống."
          example: curriculum-ktpm-haui-2024
        transcriptStatus:
          $ref: "#/components/schemas/TranscriptStatus"
        attempts:
          type: array
          description: "Bảng điểm đã xác nhận."
          items:
            $ref: "#/components/schemas/TranscriptAttemptItem"
        certificates:
          type: array
          description: "Khai báo chứng chỉ."
          items:
            $ref: "#/components/schemas/CertificateStatusItem"
