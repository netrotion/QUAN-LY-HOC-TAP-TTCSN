components:
  responses:
    BadRequest:
      description: "VALIDATION_ERROR: body sai định dạng hoặc thiếu trường bắt buộc; CURRICULUM_NOT_FOUND"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Unauthorized:
      description: "UNAUTHENTICATED: chưa đăng nhập/phiên hết hạn; INVALID_CREDENTIALS: sai mã sinh viên hoặc mật khẩu"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: "ACCESS_DENIED: thiếu/sai CSRF token hoặc tài khoản không phải STUDENT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    PayloadTooLarge:
      description: "UPLOAD_TOO_LARGE: file vượt dung lượng hoặc số trang cho phép"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnsupportedMediaType:
      description: "UNSUPPORTED_FILE_TYPE: nội dung file không phải PDF, PNG hoặc JPEG"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    TooManyRequests:
      description: "IMPORT_LIMIT_REACHED: quá số phiên nhập đang chờ xem lại"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFound:
      description: "PLAN_NOT_FOUND | IMPORT_SESSION_NOT_FOUND | REQUIREMENT_NOT_FOUND: không có tài nguyên thuộc sinh viên đang đăng nhập"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: "DATA_REVISION_STALE | PLAN_VERSION_CONFLICT | PLAN_NOT_EDITABLE | ACCOUNT_ALREADY_EXISTS | IMPORT_SESSION_CLOSED | IMPORT_VERSION_CONFLICT"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: "PLAN_NOT_VALIDATED | PLAN_VALIDATION_FAILED | IMPORT_HAS_BLOCKING_ISSUES (details = danh sách vi phạm/dòng lỗi)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotImplemented:
      description: "NOT_IMPLEMENTED: capability chưa được nối ở runtime hiện tại"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    BootstrapInfoResponse:
      type: object
      description: "Thông tin kỹ thuật của runtime (không phải DTO nghiệp vụ)."
      required: [contractVersion, contractMilestone, runtimeMode, modules]
      properties:
        contractVersion:
          type: string
          description: "Phiên bản contracts đang chạy."
          example: "1.0.0"
        contractMilestone:
          type: string
          description: "Mốc phát hành contracts."
          example: contracts-v1
        runtimeMode:
          type: string
          description: "Chế độ runtime."
          example: bootstrap-v0
        modules:
          type: object
          description: "Trạng thái từng module: READY | NOT_IMPLEMENTED | IN_MEMORY."
          properties:
            contracts:
              type: string
              description: "Module contracts."
            academic:
              type: string
              description: "Module học vụ (TV4)."
            advisor:
              type: string
              description: "Module AI (TV1)."
            persistence:
              type: string
              description: "Lưu trữ dữ liệu (TV5)."
        message:
          type: string
          description: "Ghi chú cho người vận hành."
        timestamp:
          type: string
          description: "Thời điểm server trả lời."
          format: date-time
    ApiErrorCode:
      type: string
      description: "Mã lỗi nghiệp vụ. 400 VALIDATION_ERROR, CURRICULUM_NOT_FOUND; 401 UNAUTHENTICATED, INVALID_CREDENTIALS; 403 ACCESS_DENIED; 404 PLAN_NOT_FOUND, IMPORT_SESSION_NOT_FOUND, REQUIREMENT_NOT_FOUND; 409 DATA_REVISION_STALE, PLAN_VERSION_CONFLICT, PLAN_NOT_EDITABLE, ACCOUNT_ALREADY_EXISTS, IMPORT_SESSION_CLOSED, IMPORT_VERSION_CONFLICT; 413 UPLOAD_TOO_LARGE; 415 UNSUPPORTED_FILE_TYPE; 422 PLAN_NOT_VALIDATED, PLAN_VALIDATION_FAILED, IMPORT_HAS_BLOCKING_ISSUES; 429 IMPORT_LIMIT_REACHED; 501 NOT_IMPLEMENTED."
      enum:
        - VALIDATION_ERROR
        - PLAN_NOT_FOUND
        - DATA_REVISION_STALE
        - PLAN_VERSION_CONFLICT
        - PLAN_NOT_EDITABLE
        - PLAN_NOT_VALIDATED
        - PLAN_VALIDATION_FAILED
        - NOT_IMPLEMENTED
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - ACCESS_DENIED
        - ACCOUNT_ALREADY_EXISTS
        - CURRICULUM_NOT_FOUND
        - REQUIREMENT_NOT_FOUND
        - IMPORT_SESSION_NOT_FOUND
        - IMPORT_SESSION_CLOSED
        - IMPORT_VERSION_CONFLICT
        - IMPORT_HAS_BLOCKING_ISSUES
        - IMPORT_LIMIT_REACHED
        - UPLOAD_TOO_LARGE
        - UNSUPPORTED_FILE_TYPE
    ApiErrorResponse:
      type: object
      description: "Body lỗi chung cho mọi response 4xx/5xx nghiệp vụ."
      required: [code, message, requestId, timestamp]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được cho người dùng."
        requestId:
          type: string
          description: "Mã truy vết request."
        timestamp:
          type: string
          description: "Thời điểm phát sinh lỗi."
          format: date-time
        details:
          type: array
          description: "Chi tiết bổ sung; với PLAN_VALIDATION_FAILED là danh sách vi phạm."
          items:
            type: string
          nullable: true
    AcademicRiskLevel:
      type: string
      description: "Mức rủi ro học vụ."
      enum: [NORMAL, WARNING_LEVEL_1, WARNING_LEVEL_2, CRITICAL]
    StudyPlanStatus:
      type: string
      description: "Vòng đời kế hoạch: DRAFT → VALIDATED → ACTIVE → COMPLETED | ARCHIVED. Sửa nội dung đưa về DRAFT; tối đa một ACTIVE mỗi sinh viên."
      enum: [DRAFT, VALIDATED, ACTIVE, COMPLETED, ARCHIVED]
    TrustedStudentContext:
      type: object
      description: "[Port] Danh tính sinh viên lấy từ phiên đăng nhập server; không bao giờ lấy từ client."
      required: [studentId, dataRevision]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        studentCode:
          type: string
          description: "Mã sinh viên hiển thị (MSSV)."
          nullable: true
        fullName:
          type: string
          description: "Họ tên."
          nullable: true
        majorCode:
          type: string
          description: "Mã chương trình/ngành."
          example: CT1085
          nullable: true
        cohort:
          type: string
          description: "Khóa."
          example: K19
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
    StudentDataVersion:
      type: object
      description: "[Port] Phiên bản dữ liệu học vụ hiện hành của sinh viên."
      required: [studentId, dataRevision]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
        updatedAt:
          type: string
          description: "Lần cập nhật dữ liệu học vụ gần nhất."
          format: date-time
          nullable: true
        stale:
          type: boolean
          description: "true nếu revision so sánh đã cũ."
          nullable: true
    ConversationRecord:
      type: object
      description: "[Port] Bản ghi hội thoại lưu bởi ConversationStore, chỉ chủ sở hữu đọc được."
      required: [conversationId, studentId]
      properties:
        conversationId:
          type: string
          description: "Mã hội thoại."
        studentId:
          type: string
          description: "Chủ hội thoại."
        title:
          type: string
          description: "Tiêu đề."
          nullable: true
        createdAt:
          type: string
          description: "Thời điểm tạo."
          format: date-time
          nullable: true
        updatedAt:
          type: string
          description: "Thời điểm cập nhật."
          format: date-time
          nullable: true
        messagesJson:
          type: string
          description: "Danh sách tin nhắn dạng JSON string."
          nullable: true
    AcademicStatusRequest:
      type: object
      description: "[AcademicFacade#getAcademicStatus] Input do server dựng (GET /academic/status không có body)."
      properties:
        studentId:
          type: string
          description: "Mã sinh viên. Server luôn điền từ TrustedStudentContext; client không gửi, giá trị client gửi bị bỏ qua."
          readOnly: true
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
          nullable: true
    AcademicStatusResponse:
      type: object
      description: "Tình trạng học vụ. Thiếu dữ liệu → null (UNKNOWN), không gán 0."
      required: [studentId, gpa, cpa, accumulatedCredits, dataRevision]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        gpa:
          type: number
          description: "GPA học kỳ gần nhất (thang 4); null = chưa có dữ liệu."
          nullable: true
        cpa:
          type: number
          description: "CPA tích lũy (thang 4); null = chưa có dữ liệu."
          nullable: true
        accumulatedCredits:
          type: integer
          format: int32
          description: "Số tín chỉ tích lũy (đã đạt); null = chưa có dữ liệu."
          nullable: true
        totalCreditsRequired:
          type: integer
          format: int32
          description: "Tổng tín chỉ CTĐT yêu cầu."
          nullable: true
        riskLevel:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AcademicRiskLevel"
        warnings:
          type: array
          description: "Cảnh báo học vụ."
          items:
            type: string
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
    CourseEligibilityRequest:
      type: object
      description: "Kiểm tra điều kiện đăng ký một học phần."
      required: [courseCode]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên. Server luôn điền từ TrustedStudentContext; client không gửi, giá trị client gửi bị bỏ qua."
          readOnly: true
          nullable: true
        courseCode:
          type: string
          description: "Mã học phần."
          example: IT6083
        targetSemester:
          type: string
          description: "Học kỳ dự định đăng ký."
          pattern: "^[0-9]{4}_(1|2|SUMMER)$"
          example: "2026_1"
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
          nullable: true
    CourseEligibilityResponse:
      type: object
      description: "Kết quả điều kiện đăng ký. Môn điều kiện chưa có kết quả → eligible=false và ghi UNKNOWN trong missingPrerequisites."
      required: [courseCode, eligible, missingPrerequisites]
      properties:
        courseCode:
          type: string
          description: "Mã học phần."
        eligible:
          type: boolean
          description: "Đủ điều kiện đăng ký."
        missingPrerequisites:
          type: array
          description: "Điều kiện còn thiếu, mỗi dòng bắt đầu bằng mã học phần."
          items:
            type: string
        warnings:
          type: array
          description: "Cảnh báo không chặn thao tác (hiển thị cho người dùng)."
          items:
            type: string
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
          nullable: true
    PlannedCourseItem:
      type: object
      description: "Một học phần trong một học kỳ của kế hoạch."
      required: [courseCode, credits]
      properties:
        courseCode:
          type: string
          description: "Mã học phần (theo CTĐT)."
        courseName:
          type: string
          description: "Tên học phần (theo CTĐT)."
          nullable: true
        credits:
          type: number
          description: "Số tín chỉ (số thực; CTĐT có học phần 1.5 TC)."
          minimum: 0
        targetGrade:
          type: string
          description: "Điểm chữ mục tiêu (dự kiến)."
          example: A
          nullable: true
        rationale:
          type: string
          description: "Lý do xếp môn."
          nullable: true
        courseType:
          type: string
          description: "STANDARD | RETAKE | IMPROVEMENT | ELECTIVE | ADVANCED."
          nullable: true
        status:
          type: string
          description: "Trạng thái môn trong kế hoạch: PLANNED | COMPLETED | FAILED | DROPPED."
          nullable: true
    PlannedSemesterItem:
      type: object
      description: "Một học kỳ trong kế hoạch. totalCredits = tổng credits của courses."
      required: [semesterCode, courses, totalCredits]
      properties:
        semesterOrder:
          type: integer
          format: int32
          description: "Thứ tự học kỳ trong kế hoạch, bắt đầu từ 1."
          nullable: true
        semesterCode:
          type: string
          description: "Mã học kỳ <năm bắt đầu>_<1|2|SUMMER>."
          pattern: "^[0-9]{4}_(1|2|SUMMER)$"
          example: "2026_1"
        semesterName:
          type: string
          description: "Tên hiển thị."
          nullable: true
        courses:
          type: array
          description: "Học phần trong kỳ."
          items:
            $ref: "#/components/schemas/PlannedCourseItem"
        totalCredits:
          type: integer
          format: int32
          description: "Tổng tín chỉ của kỳ."
        expectedGpa:
          type: number
          description: "GPA kỳ dự kiến (hiển thị nhãn \"Dự kiến\")."
          nullable: true
    ChatActionItem:
      type: object
      description: "Hành động gợi ý (trong chat hoặc trong kế hoạch)."
      required: [actionType]
      properties:
        actionType:
          type: string
          description: "Loại hành động, ví dụ OPEN_PLANNER, OPEN_WHAT_IF, OPEN_AUDIT, RETAKE_IMPROVEMENT, UNBLOCK_PREREQUISITE, WORKLOAD_BALANCING, CERTIFICATE."
