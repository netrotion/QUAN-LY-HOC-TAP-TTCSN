# contracts-v1 — nguồn chuẩn của hợp đồng HTTP. Sở hữu: TV5 (tv5-platform/contracts).
# Thay đổi sau mốc contracts-v1: PR của TV5 + CHANGELOG + contracts-v1.lock.json + kiểm tra phía sử dụng.
openapi: "3.0.3"
info:
  title: "HaUI Advisor API"
  version: "1.1.0"
  description: |
    contracts-v1 — hợp đồng chốt sau review prototype (Task 2.3) làm đầu vào Phase 3. Bản 1.1.0 bổ sung tài khoản, hồ sơ, CTĐT, bảng điểm, nhập bảng điểm và chứng chỉ (Task 3.2).

    Quy tắc chung:
    - Xác thực: session cookie (JSESSIONID) + CSRF (cookie XSRF-TOKEN, header X-XSRF-TOKEN) cho mọi request ghi, kể cả login. Chỉ vai trò STUDENT. Chưa đăng nhập → 401 UNAUTHENTICATED; thiếu CSRF/sai vai trò → 403 ACCESS_DENIED.
    - Danh tính sinh viên chỉ lấy từ phiên đăng nhập server (StudentContextProvider). Trường studentId trong request là readOnly: client không gửi, server bỏ qua nếu có.
    - Nhập bảng điểm: tải lên/nhập tay → xem lại → xác nhận; trước khi xác nhận không ghi gì vào bảng điểm chính thức. Số liệu in trên tài liệu (CPA, tín chỉ tích lũy) chỉ để đối chiếu, không bao giờ là nguồn tính CPA.
    - dataRevision: token phiên bản dữ liệu học vụ; thao tác ghi gửi lại nguyên văn, cũ → 409 DATA_REVISION_STALE.
    - planVersion: phiên bản nội dung kế hoạch (optimistic lock), chỉ tăng khi lưu nội dung; lệch → 409 PLAN_VERSION_CONFLICT.
    - Vòng đời kế hoạch: lưu nháp luôn DRAFT; validate hợp lệ → VALIDATED; activate chỉ nhận VALIDATED (thẩm định lại, lỗi → 422) và lưu trữ bản ACTIVE cũ trong cùng giao dịch; sửa ACTIVE tạo DRAFT kế thừa.
    - Số liệu dự kiến (projectedCpa, expectedGpa, targetGrade, phương án đề xuất) phải hiển thị nhãn "Dự kiến"; xem trước không ghi dữ liệu.
    - Một dữ liệu chỉ có một tên trường: xem glossary-v1.json. Mọi thay đổi sau mốc contracts-v1 phải qua PR của TV5 kèm kiểm tra phía sử dụng.

    x-implementation-status: trạng thái runtime hiện tại của endpoint (IMPLEMENTED, IMPLEMENTED_IN_MEMORY, NOT_IMPLEMENTED → 501); contract không đổi theo trạng thái này.
servers:
  - url: /api/v1
    description: "Base URL tương đối qua frontend proxy"
tags:
  - name: System
    description: "Thông tin hệ thống và health check"
  - name: Auth
    description: "Tài khoản HaUI Advisor, session cookie và CSRF (không đăng nhập cổng trường)"
  - name: Student
    description: "Hồ sơ sinh viên"
  - name: Academic
    description: "CTĐT, bảng điểm, nhập bảng điểm, chứng chỉ, tình trạng học vụ và điều kiện học phần"
  - name: Planner
    description: "Sinh, thẩm định, lưu, kích hoạt và khôi phục kế hoạch học tập"
  - name: Simulation
    description: "What-if, học cải thiện và tính điểm ngược"
  - name: Audit
    description: "Rà soát điều kiện tốt nghiệp"
  - name: Advisor
    description: "Trợ lý ảo học vụ"
paths:
  /auth/csrf:
    get:
      tags: [Auth]
      summary: "Lấy CSRF token (đồng thời đặt cookie XSRF-TOKEN)"
      operationId: getCsrfToken
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "CSRF token"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfTokenResponse"
  /auth/session:
    get:
      tags: [Auth]
      summary: "Trạng thái phiên đăng nhập hiện tại"
      operationId: getAuthSession
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Trạng thái phiên"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /auth/login:
    post:
      tags: [Auth]
      summary: "Đăng nhập, tạo session cookie (đổi session id chống fixation)"
      operationId: login
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: "Đã đăng nhập"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
  /auth/register:
    post:
      tags: [Auth]
      summary: "Tạo tài khoản sinh viên và đăng nhập"
      operationId: registerAccount
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        '200':
          description: "Đã tạo tài khoản và đăng nhập"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
  /auth/logout:
    post:
      tags: [Auth]
      summary: "Đăng xuất, hủy session"
      operationId: logout
      x-implementation-status: IMPLEMENTED
      responses:
        '204':
          description: "Đã đăng xuất"
        '403':
          $ref: "#/components/responses/Forbidden"
  /students/me:
    get:
      tags: [Student]
      summary: "Hồ sơ sinh viên đang đăng nhập"
      operationId: getStudentProfile
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Hồ sơ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
    put:
      tags: [Student]
      summary: "Cập nhật hồ sơ"
      operationId: updateStudentProfile
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStudentProfileRequest"
      responses:
        '200':
          description: "Hồ sơ mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfileResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
  /academic/curriculum:
    get:
      tags: [Academic]
      summary: "CTĐT của sinh viên đang đăng nhập"
      operationId: getCurriculum
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "CTĐT"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurriculumResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
  /academic/transcript:
    get:
      tags: [Academic]
      summary: "Bảng điểm đã xác nhận"
      operationId: getTranscript
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Bảng điểm"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
  /academic/transcript/imports:
    get:
      tags: [Academic]
      summary: "Các phiên nhập gần nhất"
      operationId: listTranscriptImports
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Phiên nhập"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportListResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Academic]
      summary: "Tải bảng điểm (PDF có text → parser; ảnh/PDF scan → OCR); không ghi bảng điểm trước khi xác nhận"
      operationId: uploadTranscript
      x-implementation-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: "PDF, PNG hoặc JPEG; tối đa 5 MB, 10 trang."
      responses:
        '200':
          description: "Phiên chờ xem lại hoặc chờ nhập tay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '413':
          $ref: "#/components/responses/PayloadTooLarge"
        '415':
          $ref: "#/components/responses/UnsupportedMediaType"
        '429':
          $ref: "#/components/responses/TooManyRequests"
  /academic/transcript/imports/manual:
    post:
      tags: [Academic]
      summary: "Mở phiên nhập tay (không tải file)"
      operationId: startManualTranscriptImport
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Phiên chờ nhập tay"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '429':
          $ref: "#/components/responses/TooManyRequests"
  "/academic/transcript/imports/{importSessionId}":
    get:
      tags: [Academic]
      summary: "Chi tiết phiên nhập"
      operationId: getTranscriptImport
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: importSessionId
          in: path
          required: true
          description: "Mã phiên nhập thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      responses:
        '200':
          description: "Phiên nhập"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
  "/academic/transcript/imports/{importSessionId}/rows":
    put:
      tags: [Academic]
      summary: "Sửa/thêm/bỏ chọn dòng khi xem lại"
      operationId: updateTranscriptImportRows
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: importSessionId
          in: path
          required: true
          description: "Mã phiên nhập thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImportRowsRequest"
      responses:
        '200':
          description: "Phiên sau khi sửa"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  "/academic/transcript/imports/{importSessionId}/confirm":
    post:
      tags: [Academic]
      summary: "Xác nhận: thay bảng điểm chính thức, tăng dataRevision"
      operationId: confirmTranscriptImport
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: importSessionId
          in: path
          required: true
          description: "Mã phiên nhập thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmTranscriptImportRequest"
      responses:
        '200':
          description: "Bảng điểm mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
        '422':
          $ref: "#/components/responses/UnprocessableEntity"
  "/academic/transcript/imports/{importSessionId}/cancel":
    post:
      tags: [Academic]
      summary: "Hủy phiên nhập, không ghi gì"
      operationId: cancelTranscriptImport
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: importSessionId
          in: path
          required: true
          description: "Mã phiên nhập thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      responses:
        '200':
          description: "Phiên đã hủy"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranscriptImportResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  /academic/certificates:
    get:
      tags: [Academic]
      summary: "Chuẩn đầu ra phi tín chỉ và trạng thái tự khai báo"
      operationId: listCertificates
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Danh sách"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateListResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
  "/academic/certificates/{requirementCode}":
    put:
      tags: [Academic]
      summary: "Tự khai báo trạng thái một chứng chỉ"
      operationId: declareCertificate
      x-implementation-status: IMPLEMENTED
      parameters:
        - name: requirementCode
          in: path
          required: true
          description: "Mã chuẩn đầu ra."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclareCertificateRequest"
      responses:
        '200':
          description: "Trạng thái mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatusItem"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  /system/bootstrap:
    get:
      tags: [System]
      summary: "Thông tin bootstrap kỹ thuật"
      operationId: getBootstrapInfo
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Thông tin runtime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapInfoResponse"
  /system/health:
    get:
      tags: [System]
      summary: "Health check kỹ thuật"
      operationId: getSystemHealth
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Tiến trình hoạt động"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time
  /academic/status:
    get:
      tags: [Academic]
      summary: "Tình trạng học vụ của sinh viên đang đăng nhập"
      operationId: getAcademicStatus
      x-facade-method: AcademicFacade#getAcademicStatus
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '200':
          description: "Tình trạng học vụ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicStatusResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /academic/eligibility:
    post:
      tags: [Academic]
      summary: "Kiểm tra điều kiện đăng ký học phần"
      operationId: checkCourseEligibility
      x-facade-method: AcademicFacade#checkCourseEligibility
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEligibilityRequest"
      responses:
        '200':
          description: "Kết quả điều kiện"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEligibilityResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /planner/generate:
    post:
      tags: [Planner]
      summary: "Sinh phương án lộ trình để xem trước (không lưu)"
      operationId: generateStudyPlan
      x-facade-method: AcademicFacade#generateStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStudyPlanRequest"
      responses:
        '200':
          description: "Phương án đề xuất"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /planner/validate:
    post:
      tags: [Planner]
      summary: "Thẩm định kế hoạch theo quy chế (AcademicFacade là nguồn sự thật duy nhất)"
      operationId: validateStudyPlan
      x-facade-method: AcademicFacade#validateStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateStudyPlanRequest"
      responses:
        '200':
          description: "Kết quả thẩm định"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  /planner/plans:
    get:
      tags: [Planner]
      summary: "Lịch sử kế hoạch của sinh viên"
      operationId: listStudyPlans
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      responses:
        '200':
          description: "Danh sách kế hoạch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanListResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Planner]
      summary: "Lưu nháp kế hoạch (luôn DRAFT, không đổi bản ACTIVE)"
      operationId: saveStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStudyPlanRequest"
      responses:
        '200':
          description: "Đã lưu nháp"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  "/planner/plans/{planId}":
    get:
      tags: [Planner]
      summary: "Chi tiết một kế hoạch"
      operationId: getStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      parameters:
        - name: planId
          in: path
          required: true
          description: "Mã kế hoạch thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      responses:
        '200':
          description: "Chi tiết kế hoạch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
  "/planner/plans/{planId}/activate":
    post:
      tags: [Planner]
      summary: "Kích hoạt kế hoạch VALIDATED; bản ACTIVE cũ chuyển ARCHIVED trong cùng giao dịch"
      operationId: activateStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      parameters:
        - name: planId
          in: path
          required: true
