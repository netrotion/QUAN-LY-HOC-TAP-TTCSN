# contracts-v1 — nguồn chuẩn của hợp đồng HTTP. Sở hữu: TV5 (tv5-platform/contracts).
# Thay đổi sau mốc contracts-v1: PR của TV5 + CHANGELOG + contracts-v1.lock.json + kiểm tra phía sử dụng.
openapi: "3.0.3"
info:
  title: "HaUI Advisor API"
  version: "1.0.0"
  description: |
    contracts-v1 — hợp đồng chốt sau review prototype (Task 2.3) làm đầu vào Phase 3.

    Quy tắc chung:
    - Danh tính sinh viên chỉ lấy từ phiên đăng nhập server (StudentContextProvider). Trường studentId trong request là readOnly: client không gửi, server bỏ qua nếu có.
    - dataRevision: token phiên bản dữ liệu học vụ; thao tác ghi gửi lại nguyên văn, cũ → 409 DATA_REVISION_STALE.
    - planVersion: phiên bản nội dung kế hoạch (optimistic lock), chỉ tăng khi lưu nội dung; lệch → 409 PLAN_VERSION_CONFLICT.
    - Vòng đời kế hoạch: lưu nháp luôn DRAFT; validate hợp lệ → VALIDATED; activate chỉ nhận VALIDATED (thẩm định lại, lỗi → 422) và lưu trữ bản ACTIVE cũ trong cùng giao dịch; sửa ACTIVE tạo DRAFT kế thừa.
    - Số liệu dự kiến (projectedCpa, expectedGpa, targetGrade, phương án đề xuất) phải hiển thị nhãn "Dự kiến"; xem trước không ghi dữ liệu.
    - Một dữ liệu chỉ có một tên trường: xem glossary-v1.json. Mọi thay đổi sau mốc contracts-v1 phải qua PR của TV5 kèm kiểm tra phía sử dụng.

    x-implementation-status: trạng thái runtime hiện tại của endpoint (IMPLEMENTED, IMPLEMENTED_IN_MEMORY, NOT_IMPLEMENTED → 501); contract không đổi theo trạng thái này.
servers:
  - url: /api/v1
    description: "Base URL tương đối qua frontend proxy"
tags:
  - name: System
    description: "Thông tin hệ thống và health check"
  - name: Academic
    description: "Tình trạng học vụ và điều kiện học phần"
  - name: Planner
    description: "Sinh, thẩm định, lưu, kích hoạt và khôi phục kế hoạch học tập"
  - name: Simulation
    description: "What-if, học cải thiện và tính điểm ngược"
  - name: Audit
    description: "Rà soát điều kiện tốt nghiệp"
  - name: Advisor
    description: "Trợ lý ảo học vụ"
paths:
  /system/bootstrap:
    get:
      tags: [System]
      summary: "Thông tin bootstrap kỹ thuật"
      operationId: getBootstrapInfo
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Thông tin runtime"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapInfoResponse"
  /system/health:
    get:
      tags: [System]
      summary: "Health check kỹ thuật"
      operationId: getSystemHealth
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: "Tiến trình hoạt động"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
                  timestamp:
                    type: string
                    format: date-time
  /academic/status:
    get:
      tags: [Academic]
      summary: "Tình trạng học vụ của sinh viên đang đăng nhập"
      operationId: getAcademicStatus
      x-facade-method: AcademicFacade#getAcademicStatus
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '200':
          description: "Tình trạng học vụ"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicStatusResponse"
        '403':
          $ref: "#/components/responses/Forbidden"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /academic/eligibility:
    post:
      tags: [Academic]
      summary: "Kiểm tra điều kiện đăng ký học phần"
      operationId: checkCourseEligibility
      x-facade-method: AcademicFacade#checkCourseEligibility
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseEligibilityRequest"
      responses:
        '200':
          description: "Kết quả điều kiện"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseEligibilityResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /planner/generate:
    post:
      tags: [Planner]
      summary: "Sinh phương án lộ trình để xem trước (không lưu)"
      operationId: generateStudyPlan
      x-facade-method: AcademicFacade#generateStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateStudyPlanRequest"
      responses:
        '200':
          description: "Phương án đề xuất"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /planner/validate:
    post:
      tags: [Planner]
      summary: "Thẩm định kế hoạch theo quy chế (AcademicFacade là nguồn sự thật duy nhất)"
      operationId: validateStudyPlan
      x-facade-method: AcademicFacade#validateStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateStudyPlanRequest"
      responses:
        '200':
          description: "Kết quả thẩm định"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidateStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  /planner/plans:
    get:
      tags: [Planner]
      summary: "Lịch sử kế hoạch của sinh viên"
      operationId: listStudyPlans
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      responses:
        '200':
          description: "Danh sách kế hoạch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanListResponse"
        '403':
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Planner]
      summary: "Lưu nháp kế hoạch (luôn DRAFT, không đổi bản ACTIVE)"
      operationId: saveStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStudyPlanRequest"
      responses:
        '200':
          description: "Đã lưu nháp"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
  "/planner/plans/{planId}":
    get:
      tags: [Planner]
      summary: "Chi tiết một kế hoạch"
      operationId: getStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      parameters:
        - name: planId
          in: path
          required: true
          description: "Mã kế hoạch thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      responses:
        '200':
          description: "Chi tiết kế hoạch"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
  "/planner/plans/{planId}/activate":
    post:
      tags: [Planner]
      summary: "Kích hoạt kế hoạch VALIDATED; bản ACTIVE cũ chuyển ARCHIVED trong cùng giao dịch"
      operationId: activateStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      parameters:
        - name: planId
          in: path
          required: true
          description: "Mã kế hoạch thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateStudyPlanRequest"
      responses:
        '200':
          description: "Đã kích hoạt"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivateStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
        '422':
          $ref: "#/components/responses/UnprocessableEntity"
  "/planner/plans/{planId}/restore":
    post:
      tags: [Planner]
      summary: "Tạo DRAFT mới từ một kế hoạch (thường là ARCHIVED); bản gốc giữ nguyên"
      operationId: restoreStudyPlan
      x-implementation-status: IMPLEMENTED_IN_MEMORY
      parameters:
        - name: planId
          in: path
          required: true
          description: "Mã kế hoạch thuộc sinh viên đang đăng nhập."
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreStudyPlanRequest"
      responses:
        '200':
          description: "Bản DRAFT mới"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanDetailResponse"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
  /planner/reconcile:
    post:
      tags: [Planner]
      summary: "Đối chiếu kết quả học kỳ với kế hoạch ACTIVE (US-13)"
      operationId: reconcileStudyPlan
      x-facade-method: AcademicFacade#reconcileStudyPlan
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconcileStudyPlanRequest"
      responses:
        '200':
          description: "Kết quả đối chiếu"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconcileStudyPlanResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /simulation/grades:
    post:
      tags: [Simulation]
      summary: "What-if: giả lập điểm kỳ tới"
      operationId: simulateGrades
      x-facade-method: AcademicFacade#simulateGrades
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateGradesRequest"
      responses:
        '200':
          description: "Kết quả giả lập"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulateGradesResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /simulation/retake-ranking:
    post:
      tags: [Simulation]
      summary: "Xếp hạng môn học lại/cải thiện theo hiệu quả CPA"
      operationId: rankRetakeCourses
      x-facade-method: AcademicFacade#rankRetakeCourses
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RankRetakeCoursesRequest"
      responses:
        '200':
          description: "Danh sách gợi ý"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankRetakeCoursesResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /simulation/target-grades:
    post:
      tags: [Simulation]
      summary: "Tính ngược điểm cần đạt cho CPA mục tiêu"
      operationId: calculateTargetGrades
      x-facade-method: AcademicFacade#calculateTargetGrades
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalculateTargetGradesRequest"
      responses:
        '200':
          description: "Kết quả tính ngược"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalculateTargetGradesResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '409':
          $ref: "#/components/responses/Conflict"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /audit/graduation:
    get:
      tags: [Audit]
      summary: "Rà soát điều kiện tốt nghiệp"
      operationId: runGraduationAudit
      x-facade-method: AcademicFacade#runGraduationAudit
      x-implementation-status: NOT_IMPLEMENTED
      responses:
        '200':
          description: "Kết quả rà soát"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraduationAuditResponse"
        '403':
          $ref: "#/components/responses/Forbidden"
        '501':
          $ref: "#/components/responses/NotImplemented"
  /advisor/chat:
    post:
      tags: [Advisor]
      summary: "Hỏi trợ lý học vụ"
      operationId: chatAdvisor
      x-facade-method: AdvisorFacade#chat
      x-implementation-status: NOT_IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        '200':
          description: "Câu trả lời"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        '400':
          $ref: "#/components/responses/BadRequest"
        '403':
          $ref: "#/components/responses/Forbidden"
        '501':
          $ref: "#/components/responses/NotImplemented"
components:
  responses:
    BadRequest:
      description: "VALIDATION_ERROR: body sai định dạng hoặc thiếu trường bắt buộc"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Forbidden:
      description: "Chưa đăng nhập hoặc thiếu CSRF token (Spring Security, không có body nghiệp vụ)"
    NotFound:
      description: "PLAN_NOT_FOUND: không có kế hoạch thuộc sinh viên đang đăng nhập"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    Conflict:
      description: "DATA_REVISION_STALE | PLAN_VERSION_CONFLICT | PLAN_NOT_EDITABLE"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnprocessableEntity:
      description: "PLAN_NOT_VALIDATED | PLAN_VALIDATION_FAILED (details = danh sách vi phạm)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotImplemented:
      description: "NOT_IMPLEMENTED: capability chưa được nối ở runtime hiện tại"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
  schemas:
    BootstrapInfoResponse:
      type: object
      description: "Thông tin kỹ thuật của runtime (không phải DTO nghiệp vụ)."
      required: [contractVersion, contractMilestone, runtimeMode, modules]
      properties:
        contractVersion:
          type: string
          description: "Phiên bản contracts đang chạy."
          example: "1.0.0"
        contractMilestone:
          type: string
          description: "Mốc phát hành contracts."
          example: contracts-v1
        runtimeMode:
          type: string
          description: "Chế độ runtime."
          example: bootstrap-v0
        modules:
          type: object
          description: "Trạng thái từng module: READY | NOT_IMPLEMENTED | IN_MEMORY."
          properties:
            contracts:
              type: string
              description: "Module contracts."
            academic:
              type: string
              description: "Module học vụ (TV4)."
            advisor:
              type: string
              description: "Module AI (TV1)."
            persistence:
              type: string
              description: "Lưu trữ dữ liệu (TV5)."
        message:
          type: string
          description: "Ghi chú cho người vận hành."
        timestamp:
          type: string
          description: "Thời điểm server trả lời."
          format: date-time
    ApiErrorCode:
      type: string
      description: "Mã lỗi nghiệp vụ. 400 VALIDATION_ERROR; 404 PLAN_NOT_FOUND; 409 DATA_REVISION_STALE, PLAN_VERSION_CONFLICT, PLAN_NOT_EDITABLE; 422 PLAN_NOT_VALIDATED, PLAN_VALIDATION_FAILED; 501 NOT_IMPLEMENTED."
      enum:
        - VALIDATION_ERROR
        - PLAN_NOT_FOUND
        - DATA_REVISION_STALE
        - PLAN_VERSION_CONFLICT
        - PLAN_NOT_EDITABLE
        - PLAN_NOT_VALIDATED
        - PLAN_VALIDATION_FAILED
        - NOT_IMPLEMENTED
    ApiErrorResponse:
      type: object
      description: "Body lỗi chung cho mọi response 4xx/5xx nghiệp vụ."
      required: [code, message, requestId, timestamp]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message:
          type: string
          description: "Thông điệp tiếng Việt hiển thị được cho người dùng."
        requestId:
          type: string
          description: "Mã truy vết request."
        timestamp:
          type: string
          description: "Thời điểm phát sinh lỗi."
          format: date-time
        details:
          type: array
          description: "Chi tiết bổ sung; với PLAN_VALIDATION_FAILED là danh sách vi phạm."
          items:
            type: string
          nullable: true
    AcademicRiskLevel:
      type: string
      description: "Mức rủi ro học vụ."
      enum: [NORMAL, WARNING_LEVEL_1, WARNING_LEVEL_2, CRITICAL]
    StudyPlanStatus:
      type: string
      description: "Vòng đời kế hoạch: DRAFT → VALIDATED → ACTIVE → COMPLETED | ARCHIVED. Sửa nội dung đưa về DRAFT; tối đa một ACTIVE mỗi sinh viên."
      enum: [DRAFT, VALIDATED, ACTIVE, COMPLETED, ARCHIVED]
    TrustedStudentContext:
      type: object
      description: "[Port] Danh tính sinh viên lấy từ phiên đăng nhập server; không bao giờ lấy từ client."
      required: [studentId, dataRevision]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        studentCode:
          type: string
          description: "Mã sinh viên hiển thị (MSSV)."
          nullable: true
        fullName:
          type: string
          description: "Họ tên."
          nullable: true
        majorCode:
          type: string
          description: "Mã chương trình/ngành."
          example: CT1085
          nullable: true
        cohort:
          type: string
          description: "Khóa."
          example: K19
          nullable: true
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
    StudentDataVersion:
      type: object
      description: "[Port] Phiên bản dữ liệu học vụ hiện hành của sinh viên."
      required: [studentId, dataRevision]
      properties:
        studentId:
          type: string
          description: "Mã sinh viên."
        dataRevision:
          type: string
          description: "Token phiên bản dữ liệu học vụ (StudentDataVersion.dataRevision). Gửi lại nguyên văn; khác bản hiện hành → 409 DATA_REVISION_STALE."
          example: REV-2024604757-001
        updatedAt:
          type: string
          description: "Lần cập nhật dữ liệu học vụ gần nhất."
          format: date-time
          nullable: true
        stale:
          type: boolean
          description: "true nếu revision so sánh đã cũ."
          nullable: true
    ConversationRecord:
      type: object
      description: "[Port] Bản ghi hội thoại lưu bởi ConversationStore, chỉ chủ sở hữu đọc được."
      required: [conversationId, studentId]
      properties:
        conversationId:
          type: string
          description: "Mã hội thoại."
        studentId:
          type: string
          description: "Chủ hội thoại."
        title:
          type: string
          description: "Tiêu đề."
          nullable: true
        createdAt:
          type: string
          description: "Thời điểm tạo."
          format: date-time
          nullable: true
        updatedAt:
          type: string
          description: "Thời điểm cập nhật."
          format: date-time
          nullable: true
        messagesJson:
          type: string
          description: "Danh sách tin nhắn dạng JSON string."
          nullable: true
    AcademicStatusRequest:
      type: object
      description: "[AcademicFacade#getAcademicStatus] Input do server dựng (GET /academic/status không có body)."
      properties:
        studentId:
          type: string
          description: "Mã sinh viên. Server luôn điền từ TrustedStudentContext; client không gửi, giá trị client gửi bị bỏ qua."
          readOnly: true
          nullable: true
        dataRevision:
          type: string
